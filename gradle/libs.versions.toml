# Single source of truth for every dependency and plugin version in this repository.
# Modules reference entries as libs.<alias>, e.g. implementation libs.androidx.core.ktx

[versions]
agp = "9.2.1"
kotlin = "2.2.20"

hiddenApi = "4.4.0"
refine = "4.4.0"

androidxAnnotation = "1.3.0"
androidxBrowser = "1.8.0"
androidxCore = "1.16.0"
androidxFragment = "1.8.7"
androidxLifecycle = "2.9.0"
androidxPreference = "1.2.1"
