# JitPack build configuration for jeraypop/Shizuku (multi-module Android library).
# Consumed as: com.github.jeraypop.Shizuku:<module>:<tag>   (repo: https://jitpack.io)
jdk:
  - openjdk21

# No before_install step: the sdkmanager bundled with the JitPack image fails on JDK 21
# (NoClassDefFoundError: javax/xml/bind/annotation/XmlSchema). The Android Gradle plugin
# downloads the pinned components on demand instead (compileSdk 36 / build-tools 36.0.0 /
# NDK 29.0.13113456), which is what the root build.gradle declares.

install:
  - ./gradlew publishToMavenLocal --console=plain
