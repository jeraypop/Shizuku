plugins {
    id "idea"
    // Plugin versions come from gradle/libs.versions.toml ([plugins] section).
    // AGP 9 ships Kotlin support built in: do not apply org.jetbrains.kotlin.android
    // (it conflicts with "Cannot add extension with name 'kotlin'").
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.serialization) apply false
    alias(libs.plugins.rikka.refine) apply false
}

idea.module {
    excludeDirs += file("out")
}

subprojects { subproject ->
    plugins.withId("com.android.base") {
        android {
            // SDK / NDK levels come from gradle/libs.versions.toml ([versions] section).
            compileSdk = libs.versions.androidSdkCompile.get().toInteger()
            ndkVersion = libs.versions.androidSdkNdk.get()
            defaultConfig {
                minSdk = libs.versions.androidSdkMin.get().toInteger()
                targetSdk = libs.versions.androidSdkTarget.get().toInteger()
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}

// Android Studio's "Generate Signed APK" wizard runs the build with
// -Pandroid.injected.apk.location=<dir>, and AGP applies that directory to *every*
// application module in the build. :manager drags :shell and :server-dex into the same
// graph, so all three would write output-metadata.json into the one folder and Gradle
// rejects the build ("uses this output of task ... without declaring an explicit or
// implicit dependency"). Those listing files only exist for the IDE to locate build
// output; the APKs themselves are unaffected. While the wizard is driving, skip the
// redirect tasks - they are the only consumers of that shared file.
if (project.hasProperty("android.injected.apk.location")) {
    subprojects { subproject ->
        subproject.tasks.matching {
            it.name.startsWith("create") && it.name.endsWith("ApkListingFileRedirect")
        }.configureEach {
            enabled = false
        }
    }
}

def gitCommitCount = Integer.parseInt("git rev-list --count HEAD".execute([], project.rootDir).text.trim())
def baseVersionName = "13.7.0"
def isBeta = project.hasProperty("beta")
ext {
    versionCode = gitCommitCount
    versionName = "${baseVersionName}${if (isBeta) "-beta" else ""}-jeraypop"
}
