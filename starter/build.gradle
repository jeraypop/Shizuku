plugins {
    id "com.android.library"
    id "dev.rikka.tools.refine"
}

android {
    namespace = "rikka.shizuku.starter"
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        // Fallback only; the real manager package is passed via --manager= at runtime
        buildConfigField "String", "MANAGER_APPLICATION_ID", '"moe.shizuku.privileged.api"'
    }
}

dependencies {
    implementation project(":common")
    implementation project(":shared")
    implementation project(":server-shared")
    compileOnly project(":provider")
    implementation "androidx.annotation:annotation:1.3.0"
    implementation libs.hidden.compat
    compileOnly libs.hidden.stub
    implementation libs.refine.runtime
}

apply from: rootProject.file("publish.gradle")
