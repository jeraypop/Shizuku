org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=false
# AGP 9 enables optimized resource shrinking by default and it requires non-final resource
# IDs (:app sets shrinkResources = true). The old opt-out dates from the AGP 8.0.x upgrade;
# the property is deprecated now ("current default is true") and is removed in AGP 10, so
# follow the AGP 9 default instead of fighting it.
android.nonFinalResIds=true

