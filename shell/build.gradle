import com.android.build.api.artifact.SingleArtifact

plugins {
    id "com.android.application"
    id "dev.rikka.tools.refine"
}

android {
    namespace = "rikka.shizuku.shell"
    defaultConfig {
        versionCode = rootProject.ext.versionCode
        versionName = rootProject.ext.versionName
        // Fallback only; the real manager package is provided via MANAGER_APPLICATION_ID env var
        buildConfigField "String", "MANAGER_APPLICATION_ID", '"moe.shizuku.privileged.api"'
    }
    buildTypes {
        debug {
            multiDexEnabled = false
        }
        release {
            minifyEnabled = true
            proguardFiles = ["proguard-rules.pro"]
        }
    }
    dependenciesInfo {
        includeInApk = false
    }
    lint {
        checkReleaseBuilds = false
    }
    buildFeatures {
        buildConfig = true
    }
}

// AGP 9 removed the old `applicationVariants` DSL, use androidComponents instead.
androidComponents {
    onVariants(selector().all()) { variant ->
        def variantName = variant.name
        def apkDir = variant.artifacts.get(SingleArtifact.APK.INSTANCE)
        def mappingFile = variantName == "release" ? variant.artifacts.get(SingleArtifact.OBFUSCATION_MAPPING_FILE.INSTANCE) : null
        def dexPath = "${rootProject.rootDir.path}/manager/src/main/assets"

        // Matching (instead of tasks.named) because AGP 9 registers the assemble tasks lazily.
        tasks.matching { it.name == "assemble${variantName.capitalize()}" }.configureEach {
            doLast {
                def apk = fileTree(apkDir.get().asFile).matching { include "*.apk" }.singleFile

                copy {
                    from zipTree(apk).matching { include "classes*.dex" }.singleFile
                    into dexPath
                    rename { "rish_shizuku.dex" }
                }

                if (mappingFile != null) {
                    copy {
                        from mappingFile.get().asFile
                        into new File(rootDir, "out/mapping")
                        rename { "cmd-v${rootProject.ext.versionName}.txt" }
                    }
                }
            }
        }
    }
}

dependencies {
    implementation libs.hidden.compat
    compileOnly libs.hidden.stub
}
