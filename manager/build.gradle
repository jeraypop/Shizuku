plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.rikka.refine)
}

// Directory holding the fake libshizuku_server.so built by :server-dex (see
// server-dex/build.gradle). It is generated, not checked in.
def serverJniLibDir = new File(rootProject.projectDir, "server-dex/build/shizukuServerJniLibs")

android {
    namespace = "moe.shizuku.manager"
    defaultConfig {
        versionCode = rootProject.ext.versionCode
        versionName = rootProject.ext.versionName
        // Libraries don't get VERSION_* in BuildConfig automatically (app-only);
        // BugReportDialog shows it.
        buildConfigField "String", "VERSION_NAME", "\"${rootProject.ext.versionName}\""
        consumerProguardFiles "consumer-rules.pro"
        externalNativeBuild {
            cmake {
                arguments = ["-DANDROID_STL=none"]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
        prefab = true
    }
    buildTypes {
        release {
        }
    }
    externalNativeBuild {
        cmake {
            path = file("src/main/jni/CMakeLists.txt")
            version = "3.22.1+"
        }
    }
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            // libshizuku_server.so is actually a zip holding classes.dex, not an ELF object.
            // Telling the NDK strip step to leave it alone keeps the build log clean
            // ("file was not recognized as a valid object file").
            keepDebugSymbols += "**/libshizuku_server.so"
        }
    }
    // libshizuku_server.so is generated by :server-dex, not checked in.
    sourceSets {
        main {
            jniLibs.srcDir(serverJniLibDir)
        }
    }
    lint {
        checkReleaseBuilds = false
    }
}

// The dev.rikka.tools.materialthemebuilder plugin is incompatible with AGP 9
// (it still looks up the removed BaseExtension). Its output is now checked in as
// static resources: res/values/mtb_generated.xml, res/values-v31/mtb_generated.xml
// and res/color/m3_*.xml. If the primary color (#3F51B5) ever changes, regenerate
// those files with the plugin on an AGP 8 checkout, or edit them by hand.

afterEvaluate {
    // :shell produces rish_shizuku.dex which the shell task copies into manager assets;
    // make sure it is built before the assets are merged.
    tasks.matching { it.name == "mergeReleaseAssets" }.configureEach {
        dependsOn(":shell:assembleRelease")
    }
    tasks.matching { it.name == "mergeDebugAssets" }.configureEach {
        dependsOn(":shell:assembleDebug")
    }
}

// ---------------------------------------------------------------------------
// Stand-alone server dex -> fake jniLib
//
// starter.cpp hands app_process a CLASSPATH pointing at the host APK, so the server
// (rikka.shizuku.server.ShizukuService) used to be loaded straight out of that APK. A
// 加固/加壳 packer replaces the APK's dex with a stub, which makes the server class
// unloadable and the embedded manager silently stop working ("service not running",
// binder never received, starter itself exits 0).
//
// Fix: ship the server runtime as a plain dex disguised as a native library. Packers
// leave jniLibs alone, and app_process loads a zip (whatever the file extension) just
// fine as its classpath. :server-dex builds that dex and writes one
// libshizuku_server.so per ABI into serverJniLibDir (see server-dex/build.gradle);
// this module only has to pull the directory in, which jniLibs.srcDir above does.
// ---------------------------------------------------------------------------
tasks.matching { it.name.startsWith("merge") && it.name.endsWith("JniLibFolders") }.configureEach {
    dependsOn(":server-dex:assembleRelease")
}
tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn(":server-dex:assembleRelease")
}

configurations.configureEach {
    exclude group: "androidx.appcompat", module: "appcompat"
    exclude group: "androidx.profileinstaller", module: "profileinstaller"
}

dependencies {
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android

    // api-scope so that the published POM carries the whole Shizuku runtime
    // (server runs from the host APK via app_process) and host apps only need
    // a single dependency.
    api project(":server")
    api project(":rish")
    api project(":starter")
    api project(":api")
    api project(":provider")

    implementation libs.hidden.compat
    compileOnly libs.hidden.stub

    implementation libs.androidx.startup.runtime
