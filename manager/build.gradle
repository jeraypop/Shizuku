import java.nio.file.Paths

plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.serialization"
    id "dev.rikka.tools.refine"
    id "dev.rikka.tools.materialthemebuilder"
}

android {
    namespace = "moe.shizuku.manager"
    defaultConfig {
        versionCode = rootProject.ext.versionCode
        versionName = rootProject.ext.versionName
        // Libraries don't get VERSION_* in BuildConfig automatically (app-only);
        // BugReportDialog shows it.
        buildConfigField "String", "VERSION_NAME", "\"${rootProject.ext.versionName}\""
        consumerProguardFiles "consumer-rules.pro"
        externalNativeBuild {
            cmake {
                arguments = ["-DANDROID_STL=none"]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
        prefab = true
    }
    buildTypes {
        release {
        }
    }
    externalNativeBuild {
        cmake {
            path = file("src/main/jni/CMakeLists.txt")
            version = "3.22.1+"
        }
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    lint {
        checkReleaseBuilds = false
    }
}

materialThemeBuilder {
    themes {
        shizuku {
            primaryColor = "#3F51B5"
            lightThemeFormat = "Theme.Material3Expressive.Light.%s"
            lightThemeParent = "Theme.Material3Expressive.Light"
            darkThemeFormat = "Theme.Material3Expressive.Dark.%s"
            darkThemeParent = "Theme.Material3Expressive.Dark"
        }
        dynamic_colors_overlay {
            dynamicColors = true
            lightThemeFormat = "ThemeOverlay.Material3.DynamicColors.Light.Shizuku"
            lightThemeParent = "ThemeOverlay.Material3.DynamicColors.Light"
            darkThemeFormat = "ThemeOverlay.Material3.DynamicColors.Dark.Shizuku"
            darkThemeParent = "ThemeOverlay.Material3.DynamicColors.Dark"
        }
    }
    generatePalette = true
    generateTextColors = true
}

afterEvaluate {
    // :shell produces rish_shizuku.dex which the shell task copies into manager assets;
    // make sure it is built before the assets are merged.
    tasks.matching { it.name == "mergeReleaseAssets" }.configureEach {
        dependsOn(":shell:assembleRelease")
    }
    tasks.matching { it.name == "mergeDebugAssets" }.configureEach {
        dependsOn(":shell:assembleDebug")
    }
}

configurations.configureEach {
    exclude group: "androidx.appcompat", module: "appcompat"
    exclude group: "androidx.profileinstaller", module: "profileinstaller"
}

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    // api-scope so that the published POM carries the whole Shizuku runtime
    // (server runs from the host APK via app_process) and host apps only need
    // a single dependency.
    api project(":server")
    api project(":rish")
    api project(":starter")
    api project(":api")
    api project(":provider")

    implementation libs.hidden.compat
    compileOnly libs.hidden.stub

    implementation "androidx.startup:startup-runtime:1.2.0"
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.fragment:fragment-ktx:1.8.7"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.9.0"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "androidx.work:work-runtime-ktx:2.10.4"

    implementation "com.android.tools.build:apksig:8.13.2"
    implementation "com.google.android.material:material:1.14.0-alpha08"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.github.topjohnwu.libsu:core:6.0.0"

    implementation "dev.rikka.rikkax.appcompat:appcompat:1.6.1"
    implementation "dev.rikka.rikkax.compatibility:compatibility:2.0.0"
    implementation "dev.rikka.rikkax.core:core-ktx:1.4.1"
    implementation "dev.rikka.rikkax.material:material:2.7.2"
    implementation "dev.rikka.rikkax.material:material-preference:2.0.0"
    implementation "dev.rikka.rikkax.html:html-ktx:1.1.2"
    implementation "dev.rikka.rikkax.recyclerview:recyclerview-adapter:1.3.0"
    implementation "dev.rikka.rikkax.recyclerview:recyclerview-ktx:1.3.2"
    implementation "dev.rikka.rikkax.insets:insets:1.3.0"
    implementation "dev.rikka.rikkax.layoutinflater:layoutinflater:1.3.0"
    implementation "dev.rikka.rikkax.preference:simplemenu-preference:1.0.3"
    implementation "dev.rikka.rikkax.lifecycle:lifecycle-resource-livedata:1.0.1"

    implementation "io.github.reandroid:ARSCLib:1.3.8"
    implementation "io.github.vvb2060.ndk:boringssl:20250114"

    implementation "org.bouncycastle:bcpkix-jdk18on:1.80"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.10.0"
    implementation "org.lsposed.libcxx:libcxx:27.0.12077973"
    implementation "org.lsposed.hiddenapibypass:hiddenapibypass:6.1"

    implementation "me.zhanghai.android.appiconloader:appiconloader:1.5.0"
}

apply from: rootProject.file("publish.gradle")
