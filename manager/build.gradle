import java.nio.file.Paths

plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.rikka.refine)
}

android {
    namespace = "moe.shizuku.manager"
    defaultConfig {
        versionCode = rootProject.ext.versionCode
        versionName = rootProject.ext.versionName
        // Libraries don't get VERSION_* in BuildConfig automatically (app-only);
        // BugReportDialog shows it.
        buildConfigField "String", "VERSION_NAME", "\"${rootProject.ext.versionName}\""
        consumerProguardFiles "consumer-rules.pro"
        externalNativeBuild {
            cmake {
                arguments = ["-DANDROID_STL=none"]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
        prefab = true
    }
    buildTypes {
        release {
        }
    }
    externalNativeBuild {
        cmake {
            path = file("src/main/jni/CMakeLists.txt")
            version = "3.22.1+"
        }
    }
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    lint {
        checkReleaseBuilds = false
    }
}

// The dev.rikka.tools.materialthemebuilder plugin is incompatible with AGP 9
// (it still looks up the removed BaseExtension). Its output is now checked in as
// static resources: res/values/mtb_generated.xml, res/values-v31/mtb_generated.xml
// and res/color/m3_*.xml. If the primary color (#3F51B5) ever changes, regenerate
// those files with the plugin on an AGP 8 checkout, or edit them by hand.

afterEvaluate {
    // :shell produces rish_shizuku.dex which the shell task copies into manager assets;
    // make sure it is built before the assets are merged.
    tasks.matching { it.name == "mergeReleaseAssets" }.configureEach {
        dependsOn(":shell:assembleRelease")
    }
    tasks.matching { it.name == "mergeDebugAssets" }.configureEach {
        dependsOn(":shell:assembleDebug")
    }
}

configurations.configureEach {
    exclude group: "androidx.appcompat", module: "appcompat"
    exclude group: "androidx.profileinstaller", module: "profileinstaller"
}

dependencies {
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android

    // api-scope so that the published POM carries the whole Shizuku runtime
    // (server runs from the host APK via app_process) and host apps only need
    // a single dependency.
    api project(":server")
    api project(":rish")
    api project(":starter")
    api project(":api")
    api project(":provider")

    implementation libs.hidden.compat
    compileOnly libs.hidden.stub

    implementation libs.androidx.startup.runtime
    implementation libs.androidx.browser
    implementation libs.androidx.core.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.recyclerview
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.work.runtime.ktx

    implementation libs.android.tools.apksig
    implementation libs.google.material
    implementation libs.okhttp
    implementation libs.libsu.core

    implementation libs.rikka.appcompat
    implementation libs.rikka.compatibility
    implementation libs.rikka.core.ktx
    implementation libs.rikka.material
    implementation libs.rikka.material.preference
    implementation libs.rikka.html.ktx
    implementation libs.rikka.recyclerview.adapter
    implementation libs.rikka.recyclerview.ktx
    implementation libs.rikka.insets
    implementation libs.rikka.layoutinflater
    implementation libs.rikka.simplemenu.preference
    implementation libs.rikka.lifecycle.resource.livedata

    implementation libs.arsclib
    implementation libs.ndk.boringssl

    implementation libs.bouncycastle.bcpkix
    implementation libs.kotlinx.serialization.json
    implementation libs.libcxx
    implementation libs.hiddenapibypass

    implementation libs.appicon.loader
}

apply from: rootProject.file("publish.gradle")
